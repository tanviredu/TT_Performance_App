{% load static %}
<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TT Equipment Hours{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'equipment/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{% url 'equipment:entry' %}">TT EQUIPMENT HOURS</a>
      {% if request.user.is_staff %}
        <nav><a href="{% url 'equipment:report' %}">Reports</a><a href="/admin/">Admin</a></nav>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
